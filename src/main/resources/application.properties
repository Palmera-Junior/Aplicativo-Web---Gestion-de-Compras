# Nombre de la aplicación que Spring Boot muestra en registros y herramientas de monitoreo.
spring.application.name=gestion_compras
# Puerto HTTP de la aplicación; Nginx lo expone externamente en el mismo puerto.
server.port=8081
# Importa el archivo .env local como configuración opcional; en Docker las variables deben pasarse al contenedor desde Compose.
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL
# URL JDBC de la base de datos; local por defecto y normalmente sobrescrita en Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Palmera_Junior}
# Usuario JDBC: prioriza SPRING_DATASOURCE_USERNAME, luego DB_USERNAME/DB_USER y finalmente postgres.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:postgres}}}
# Contraseña JDBC: prioriza SPRING_DATASOURCE_PASSWORD y luego DB_PASSWORD; sin valor usa cadena vacía.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
# Controlador JDBC que permite a Spring conectarse a PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA, Hibernate e inicialización de datos
# Verifica que los schemas y tablas hayan sido creados por los scripts SQL.
spring.jpa.hibernate.ddl-auto=validate
# Inicializa schemas y tablas antes de que Hibernate valide las entidades.
spring.jpa.defer-datasource-initialization=false
# Ejecuta el DDL existente en cada inicio; sus sentencias son idempotentes.
spring.sql.init.mode=always
# Scripts de esquema existentes, incluidos en el classpath por Maven.
spring.sql.init.schema-locations=classpath:db-init/01-create-schema.sql,classpath:db-init/DDL.sql
# Carga los catálogos y el usuario inicial después de crear el esquema.
spring.sql.init.data-locations=classpath:db/dml.sql
# Codificación usada al leer los scripts SQL de inicialización.
spring.sql.init.encoding=UTF-8
# Escribe las sentencias SQL de Hibernate en los registros para diagnóstico.
spring.jpa.show-sql=true
# Da formato legible a las sentencias SQL registradas por Hibernate.
spring.jpa.properties.hibernate.format_sql=true
# Dialecto de Hibernate para generar SQL compatible con PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Límites para carga de archivos
# Tamaño máximo permitido para cada archivo enviado.
spring.servlet.multipart.max-file-size=10MB
# Tamaño máximo permitido para el conjunto de archivos de una solicitud.
spring.servlet.multipart.max-request-size=55MB

# Inicio de sesión con Microsoft Entra ID
# Identificador de la aplicación registrada en Microsoft Entra ID.
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
# Secreto de la aplicación registrada; debe suministrarse de forma segura fuera del repositorio.
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
# Datos de identidad solicitados durante el inicio de sesión OAuth2.
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
# Asocia el registro OAuth2 "microsoft" con el proveedor configurado abajo.
spring.security.oauth2.client.registration.microsoft.provider=microsoft
# URL de retorno tras autenticarse; permite sobrescribir la URL calculada por Spring.
spring.security.oauth2.client.registration.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
# Emisor OpenID de Microsoft Entra ID para el tenant configurado.
spring.security.oauth2.client.provider.microsoft.issuer-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:}/v2.0
# Interruptor propio que habilita o deshabilita las rutas y configuración de OAuth2 Microsoft.
security.oauth2.microsoft.enabled=${MICROSOFT_OAUTH2_ENABLED:false}

# Amazon SES y destinatarios de correo
# Región AWS donde está configurado Amazon SES.
aws.ses.region=${AWS_DEFAULT_REGION_SES:us-east-1}
# Clave de acceso usada por la integración SES cuando se configura explícitamente.
aws.ses.access-key-id=${AWS_ACCESS_KEY_ID_SES:}
# Clave secreta de SES; no guardar su valor en el repositorio.
aws.ses.secret-access-key=${AWS_SECRET_ACCESS_KEY_SES:}
# Dirección remitente que aparece en los correos enviados por la aplicación.
correo.remitente=${MAIL_FROM_ADDRESS:notificaciones@palmerajunior.com}
# Nombre visible del remitente en los mensajes enviados.
correo.remitente-nombre=${MAIL_FROM_NAME:Notificaciones Palmera Junior}
# Destino de avisos de facturación; si falta la variable se usa el correo predeterminado.
correo.notificacion-facturacion=${FACTURACION_NOTIFICACION_EMAIL:felipecorzo47@gmail.com}
# Destino de avisos de contabilidad; si falta, reutiliza FACTURACION_NOTIFICACION_EMAIL y luego el valor predeterminado.
correo.notificacion-contabilidad=${CONTABILIDAD_NOTIFICACION_EMAIL:${FACTURACION_NOTIFICACION_EMAIL:felipecorzo47@gmail.com}}
# URL pública incluida en enlaces de los correos;
correo.plataforma-url=${APP_BASE_URL:http://localhost:8081}

# Endpoints de monitoreo de Spring Boot Actuator
# Expone por HTTP únicamente los endpoints de estado y metadatos indicados.
management.endpoints.web.exposure.include=health,info
# Evita publicar el índice de descubrimiento de endpoints Actuator.
management.endpoints.web.discovery.enabled=false
# Deshabilita la exposición de endpoints de monitoreo mediante JMX.
management.endpoints.jmx.exposure.exclude=*
# Oculta detalles internos del estado de salud en la respuesta HTTP.
management.endpoint.health.show-details=never

# Procesamiento de correos pendientes
# Pausa en milisegundos entre ejecuciones del procesador de la tabla auditoria_envio_correo.
correo.outbox.intervalo-ms=30000

# Sesiones y cookies
# Interpreta encabezados del proxy inverso, como X-Forwarded-Proto, al construir URL y seguridad.
server.forward-headers-strategy=framework
# Guarda el identificador de sesión únicamente en una cookie, no en la URL.
server.servlet.session.tracking-modes=cookie
# Nombre de la cookie de sesión de esta aplicación.
server.servlet.session.cookie.name=GESTION_COMPRAS_SESSION
# Impide que JavaScript del navegador lea la cookie de sesión.
server.servlet.session.cookie.http-only=true
# Permite el envío de la cookie en navegaciones de retorno OAuth2 de nivel superior.
server.servlet.session.cookie.same-site=lax
# Marca la cookie como exclusiva de HTTPS cuando SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Duración de inactividad permitida antes de expirar la sesión.
server.servlet.session.timeout=30m
