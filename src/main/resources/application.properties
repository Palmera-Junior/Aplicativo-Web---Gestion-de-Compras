spring.application.name=gestion_compras
spring.config.import=optional:file:.env[.properties]

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Palmera_Junior}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/dml.sql
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:dep_compras}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Config para login con Outlook
# spring.security.oauth2.client.registration.microsoft.client-id=XXXXX
# spring.security.oauth2.client.registration.microsoft.client-secret=XXXXX
# spring.security.oauth2.client.registration.microsoft.scope=profile,email
security.oauth2.microsoft.enabled=${MICROSOFT_OAUTH2_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never


spring.mail.host=${SES_SMTP_HOST:email-smtp.us-east-1.amazonaws.com}
spring.mail.port=${SES_SMTP_PORT:587}
spring.mail.username=${SES_SMTP_USERNAME}
spring.mail.password=${SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
correo.remitente=${SES_FROM_EMAIL:notificaciones@palmerajunior.com}
correo.notificacion-facturacion=${FACTURACION_NOTIFICACION_EMAIL:recepcionfacturas@palmerajunior.com}




# Procesamiento de correos pendientes de la tabla auditoria_envio_correo
correo.outbox.intervalo-ms=30000

# En producción, SESSION_COOKIE_SECURE debe ser true y la aplicación debe estar detrás de HTTPS.
server.forward-headers-strategy=framework
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=GESTION_COMPRAS_SESSION
server.servlet.session.cookie.http-only=true
# "strict" rompe el login con Google/Microsoft: el callback de OAuth2 (/login/oauth2/code/
# sesión con SameSite=Strict, perdiendo el "state" guardado y fallando la autenticación....)
# llega como navegación cross-site de nivel superior y el navegador no envía la cookie de
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
