<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <aside th:fragment="principal(vista)" class="app-navigation" aria-label="Navegación principal">
        <nav id="main-admin-sidebar" sec:authorize="hasAnyAuthority('PERM_PANEL_ADMINISTRACION', 'PERM_PRODUCTOS_GESTIONAR', 'PERM_PROVEEDORES_GESTIONAR', 'PERM_SEDES_GESTIONAR', 'PERM_CENTROS_COSTO_GESTIONAR') or hasAuthority('PERM_PRODUCTOS_GESTIONAR') or hasAuthority('PERM_PROVEEDORES_GESTIONAR') or hasAuthority('PERM_SEDES_GESTIONAR') or hasAuthority('PERM_CENTROS_COSTO_GESTIONAR') or hasAuthority('PERM_POLIZAS_VER') or hasAuthority('PERM_POLIZAS_GESTIONAR') or hasAuthority('PERM_POLIZAS_APROBAR') or hasAuthority('PERM_ORDENES_VER') or hasAuthority('PERM_ORDENES_GESTIONAR') or hasAuthority('PERM_ORDENES_APROBAR')" class="app-sidebar">
            <button type="button" class="sidebar-mobile-toggle" aria-label="Expandir navegación"
                aria-expanded="false" aria-controls="main-admin-sidebar" title="Expandir navegación">
                <span class="material-symbols" aria-hidden="true">menu</span>
            </button>
            <div sec:authorize="hasAnyAuthority('PERM_PANEL_ADMINISTRACION', 'PERM_PRODUCTOS_GESTIONAR', 'PERM_PROVEEDORES_GESTIONAR', 'PERM_SEDES_GESTIONAR', 'PERM_CENTROS_COSTO_GESTIONAR')" class="sidebar-section">
                <p class="sidebar-label">Principal</p>
                <a th:href="@{/admin}" class="sidebar-link js-page-transition" aria-label="Dashboard" title="Dashboard"
                    th:classappend="${vista == 'admin' and catalogoActivo == null} ? ' is-current' : ''"
                    th:attr="aria-current=${vista == 'admin' and catalogoActivo == null} ? 'page' : null">
                    <span class="material-symbols">grid_view</span><span>Dashboard</span>
                </a>
            </div>

            <div class="sidebar-section">
                <p class="sidebar-label">Operación</p>
                <a sec:authorize="hasAnyAuthority('PERM_ORDENES_VER', 'PERM_ORDENES_GESTIONAR', 'PERM_ORDENES_APROBAR')" th:href="@{/dashboard}" class="sidebar-link js-page-transition" aria-label="Compras" title="Compras"
                    th:classappend="${vista == 'compras'} ? ' is-current' : ''"
                    th:attr="aria-current=${vista == 'compras'} ? 'page' : null">
                    <span class="material-symbols" aria-hidden="true">shopping_cart</span><span>Compras</span>
                    <span sec:authorize="hasRole('APROBADOR')" th:if="${borradoresOrdenesSede > 0}"
                        class="sidebar-pending-count" th:text="${borradoresOrdenesSede}"
                        th:title="${'Órdenes pendientes por aprobar: ' + borradoresOrdenesSede}"
                        th:attr="aria-label=${borradoresOrdenesSede + ' órdenes pendientes por aprobar'}">0</span>
                </a>
                <a sec:authorize="hasAnyAuthority('PERM_POLIZAS_VER', 'PERM_POLIZAS_GESTIONAR', 'PERM_POLIZAS_APROBAR')" th:href="@{/polizas}" class="sidebar-link js-page-transition" aria-label="Pólizas" title="Pólizas"
                    th:classappend="${vista == 'polizas'} ? ' is-current' : ''"
                    th:attr="aria-current=${vista == 'polizas'} ? 'page' : null">
                    <span class="material-symbols" aria-hidden="true">verified_user</span><span>Pólizas</span>
                    <span sec:authorize="hasRole('APROBADOR')" th:if="${borradoresPolizasSede > 0}"
                        class="sidebar-pending-count" th:text="${borradoresPolizasSede}"
                        th:title="${'Pólizas pendientes por aprobar: ' + borradoresPolizasSede}"
                        th:attr="aria-label=${borradoresPolizasSede + ' pólizas pendientes por aprobar'}">0</span>
                </a>
            </div>

            <div class="sidebar-section sidebar-system">
                <p class="sidebar-label">Sistema</p>
                <div class="sidebar-system-group"
                    th:classappend="${catalogoActivo != null} ? ' is-open' : ''">
                    <button type="button" class="sidebar-link sidebar-group-title" aria-label="Configuración" title="Configuración"
                        th:attr="aria-expanded=${catalogoActivo != null}"
                        aria-controls="sidebar-system-menu">
                        <span class="material-symbols">settings</span><span>Configuración</span><span class="material-symbols sidebar-chevron">expand_more</span>
                    </button>
                    <div id="sidebar-system-menu" class="sidebar-submenu">
                        <a sec:authorize="hasAuthority('PERM_PRODUCTOS_GESTIONAR')" th:href="@{/admin/catalogos/productos}" data-admin-section="section-productos"
                            th:classappend="${catalogoActivo == 'productos'} ? ' is-current' : ''">Productos</a>
                        <a sec:authorize="hasAuthority('PERM_PROVEEDORES_GESTIONAR')" th:href="@{/admin/catalogos/proveedores}" data-admin-section="section-proveedores"
                            th:classappend="${catalogoActivo == 'proveedores'} ? ' is-current' : ''">Proveedores</a>
                        <a sec:authorize="hasAuthority('PERM_SEDES_GESTIONAR')" th:href="@{/admin/catalogos/sedes}" data-admin-section="section-sedes"
                            th:classappend="${catalogoActivo == 'sedes'} ? ' is-current' : ''">Sedes</a>
                        <a sec:authorize="hasAuthority('PERM_CENTROS_COSTO_GESTIONAR')" th:href="@{/admin/catalogos/centros}" data-admin-section="section-centros"
                            th:classappend="${catalogoActivo == 'centros'} ? ' is-current' : ''">Centros de costo</a>
                        <a sec:authorize="hasRole('SUPERADMINISTRADOR')" th:href="@{/admin/catalogos/usuarios}" data-admin-section="section-usuarios"
                            th:classappend="${catalogoActivo == 'usuarios'} ? ' is-current' : ''">Usuarios</a>
                        <a sec:authorize="hasRole('SUPERADMINISTRADOR')" th:href="@{/admin/catalogos/permisos}"
                            th:classappend="${catalogoActivo == 'permisos'} ? ' is-current' : ''"
                            th:attr="aria-current=${catalogoActivo == 'permisos'} ? 'page' : null">Roles y Permisos</a>
                    </div>
                </div>
            </div>
        </nav>
        <script th:src="@{/js/navegacion.js(v=1)}"></script>
    </aside>
</body>
</html>
