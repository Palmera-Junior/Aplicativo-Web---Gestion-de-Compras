<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Tarjeta de empleado</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #1c2b3d;
            background: #f1f5f9;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 0, rgba(55, 111, 178, .12), transparent 52%),
                #f1f5f9;
        }

        .rrhh-public-card {
            width: min(100%, 440px);
            overflow: hidden;
            border: 1px solid #dfe7ef;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 20px 55px rgba(27, 48, 73, .13);
        }

        .rrhh-public-card > header {
            min-height: 78px;
            padding: 20px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #fff;
            background: linear-gradient(115deg, #173b63, #28649a);
        }

        .rrhh-public-card > header strong {
            font-size: 15px;
            letter-spacing: .12em;
        }

        .rrhh-public-card > header span {
            color: #d7e8f7;
            font-size: 11px;
            text-align: right;
        }

        .rrhh-public-photo {
            box-sizing: border-box;
            width: 120px;
            min-width: 120px;
            max-width: 120px;
            height: 120px;
            min-height: 120px;
            max-height: 120px;
            margin: 26px auto 15px;
            display: block;
            flex: 0 0 120px;
            aspect-ratio: 1;
            overflow: hidden;
            border: 4px solid #e8f0f8;
            border-radius: 50%;
            object-fit: cover;
            background: #f1f5f9;
        }

        .rrhh-public-card h1 {
            margin: 0 auto 23px;
            padding: 0 24px;
            color: #203b58;
            font-size: clamp(20px, 5vw, 25px);
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .rrhh-public-card dl {
            margin: 0;
            padding: 0 26px;
        }

        .rrhh-public-card dl > div {
            min-height: 49px;
            padding: 12px 0;
            display: grid;
            grid-template-columns: minmax(100px, 38%) 1fr;
            gap: 12px;
            border-top: 1px solid #edf1f5;
        }

        .rrhh-public-card dt {
            color: #758397;
            font-size: 12px;
            font-weight: 600;
        }

        .rrhh-public-card dd {
            margin: 0;
            color: #263d57;
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .rrhh-public-card > a {
            min-height: 44px;
            margin: 20px 26px 0;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            color: #fff;
            background: #28649a;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background-color .15s ease;
        }

        .rrhh-public-card > a:hover {
            background: #1f527f;
        }

        .rrhh-public-card > a:focus-visible {
            outline: 3px solid #8fc4f2;
            outline-offset: 3px;
        }

        .rrhh-public-card > footer {
            margin-top: 22px;
            padding: 15px 20px;
            border-top: 1px solid #edf1f5;
            color: #8290a1;
            font-size: 10px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 380px) {
            body {
                padding: 18px 10px;
            }

            .rrhh-public-card > header,
            .rrhh-public-card dl {
                padding-right: 18px;
                padding-left: 18px;
            }

            .rrhh-public-card dl > div {
                grid-template-columns: 1fr 1.2fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body class="rrhh-public-card-page">
<main class="rrhh-public-card" aria-labelledby="public-card-title">
    <header><strong>PALMERA JUNIOR</strong><span>Identificación digital</span></header>
    <img class="rrhh-public-photo" th:if="${tarjeta.fotoUrl != null}" th:src="${tarjeta.fotoUrl}" alt="Fotografía del empleado">
    <h1 id="public-card-title" th:text="${tarjeta.primerNombre + ' ' + (tarjeta.segundoNombre ?: '') + ' ' + tarjeta.primerApellido + ' ' + (tarjeta.segundoApellido ?: '')}">Nombre</h1>
    <dl>
        <div><dt>Cargo</dt><dd th:text="${tarjeta.cargo ?: '—'}">Cargo</dd></div>
        <div><dt>Área</dt><dd th:text="${tarjeta.area ?: '—'}">Área</dd></div>
        <div><dt>Sede</dt><dd th:text="${tarjeta.sede ?: '—'}">Sede</dd></div>
        <div><dt>Estado</dt><dd th:text="${tarjeta.estado}">Estado</dd></div>
        <div><dt>Factor RH</dt><dd th:text="${tarjeta.rh ?: '—'}">RH</dd></div>
    </dl>
    <a th:if="${tarjeta.arlUrl != null}" th:href="${tarjeta.arlUrl}"
       target="_blank" rel="nofollow noopener noreferrer">Abrir y ver certificado ARL</a>
    <footer>Tarjeta pública · Información autorizada para consulta</footer>
</main>
</body>
</html>
