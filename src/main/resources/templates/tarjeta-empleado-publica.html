<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Tarjeta digital del empleado</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #101f58;
            background: #f0f3f9;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 20px 14px;
            display: grid;
            place-items: center;
            background: #f0f3f9;
        }

        .rrhh-public-card {
            width: min(100%, 400px);
            overflow: hidden;
            border-radius: 17px;
            background: #fff;
            box-shadow: 0 16px 40px rgba(18, 35, 83, .16);
        }

        .rrhh-public-card > header {
            position: relative;
            min-height: 98px;
            padding: 16px 28px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: center;
            border-bottom: 4px solid #13265f;
        }

        .rrhh-public-card > header img {
            width: auto;
            max-width: 90%;
            justify-self: center;
            object-fit: contain;
        }

        .rrhh-public-card > header .logo-palmera {
            max-height: 62px;
        }

        .rrhh-public-card > header .logo-anticimex {
            max-height: 25px;
        }

        .rrhh-public-card > header .logo-divider {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1px;
            height: 44px;
            transform: translate(-50%, -50%);
            background: #dce2ed;
        }

        .rrhh-employee-identity {
            padding: 24px 20px 21px;
            text-align: center;
        }

        .rrhh-photo-wrap {
            position: relative;
            width: 116px;
            height: 116px;
            margin: 0 auto 15px;
        }

        .rrhh-public-photo,
        .rrhh-photo-placeholder {
            width: 116px;
            height: 116px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 2px solid #399745;
            border-radius: 50%;
            color: #3c9148;
            background: #e4f1e5;
            box-shadow: inset 0 0 0 5px #fff;
        }

        .rrhh-public-photo {
            object-fit: cover;
        }

        .rrhh-photo-placeholder svg {
            width: 58px;
            height: 58px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.2;
        }

        .rrhh-employee-status {
            position: absolute;
            right: -27px;
            bottom: 3px;
            min-height: 30px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 3px solid #fff;
            border-radius: 9px;
            color: #267c36;
            background: #e3f2e4;
            box-shadow: 0 3px 9px rgba(15, 33, 75, .16);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .rrhh-employee-status::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            content: "";
        }

        .rrhh-employee-status.status-inactive {
            color: #a33b43;
            background: #fbe4e5;
        }

        .rrhh-employee-status.status-pending {
            color: #8a5d00;
            background: #fff1cf;
        }

        .rrhh-employee-identity h1 {
            margin: 0;
            color: #10245f;
            font-size: clamp(20px, 5vw, 23px);
            font-weight: 800;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .rrhh-employee-info {
            margin: 0 20px;
        }

        .rrhh-employee-info dl {
            margin: 0;
        }

        .rrhh-employee-info dl > div {
            min-height: 55px;
            padding: 8px 15px;
            display: grid;
            grid-template-columns: minmax(56px, .75fr) minmax(0, 1.5fr);
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e1e6ef;
        }

        .rrhh-employee-info dl > div:first-child {
            border-top: 1px solid #e1e6ef;
        }

        .rrhh-arl-icon svg,
        .rrhh-arl-view svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        .rrhh-employee-info dt {
            color: #74809a;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .rrhh-employee-info dd {
            min-width: 0;
            margin: 0;
            color: #17284d;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .rrhh-arl-panel {
            min-height: 64px;
            margin: 15px 20px 19px;
            padding: 10px 14px;
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr) 32px;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #3c9b48;
            border-radius: 11px;
            color: #226e34;
            background: #e4f2e5;
        }

        .rrhh-arl-icon {
            display: grid;
            place-items: center;
        }

        .rrhh-arl-copy {
            min-width: 0;
        }

        .rrhh-arl-copy span {
            display: block;
            margin-bottom: 3px;
            color: #26783a;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .rrhh-arl-copy strong {
            display: block;
            color: #10245f;
            font-size: 13px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .rrhh-arl-view {
            width: 32px;
            height: 32px;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #14532d;
            text-decoration: none;
        }

        .rrhh-arl-view svg {
            width: 22px;
            height: 22px;
        }

        .rrhh-arl-view:hover {
            color: #0b3d20;
        }

        .rrhh-arl-view:focus-visible {
            outline: 3px solid #548f5d;
            outline-offset: 3px;
        }

        .rrhh-public-card > footer {
            min-height: 40px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #fff;
            background: #13276b;
            font-size: 10px;
        }

        .rrhh-public-card > footer strong {
            font-weight: 700;
        }

        .rrhh-footer-accent {
            width: 36px;
            height: 4px;
            flex: 0 0 36px;
            border-radius: 4px;
            background: #3c9b48;
        }

        @media (max-width: 360px) {
            .rrhh-public-card > header {
                padding-inline: 20px;
            }

            .rrhh-employee-info,
            .rrhh-arl-panel {
                margin-right: 14px;
                margin-left: 14px;
            }

            .rrhh-employee-info dl > div {
                padding-inline: 10px;
                grid-template-columns: minmax(48px, .75fr) minmax(0, 1.2fr);
                gap: 7px;
            }

            .rrhh-arl-panel {
                padding-inline: 10px;
                grid-template-columns: 24px minmax(0, 1fr) 32px;
                gap: 7px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body class="rrhh-public-card-page">
<main class="rrhh-public-card" aria-labelledby="public-card-title">
    <header aria-label="Logos de la empresa">
        <img class="logo-palmera" th:src="@{/imgs/logo1.png}" alt="Palmera Junior">
        <span class="logo-divider" aria-hidden="true"></span>
        <img class="logo-anticimex" th:src="@{/imgs/logoAnticimex.png}" alt="Anticimex">
    </header>

    <section class="rrhh-employee-identity" aria-label="Identificación del empleado">
        <div class="rrhh-photo-wrap">
            <img class="rrhh-public-photo" th:if="${tarjeta.fotoUrl != null}"
                 th:src="${tarjeta.fotoUrl}" alt="Fotografía del empleado">
            <span class="rrhh-photo-placeholder" th:unless="${tarjeta.fotoUrl != null}"
                  aria-label="Sin fotografía">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <circle cx="24" cy="15" r="7"></circle>
                    <path d="M9 40c1.8-8 7.1-12 15-12s13.2 4 15 12"></path>
                </svg>
            </span>
            <span class="rrhh-employee-status"
                  th:classappend="${tarjeta.estado == 'Activo' ? 'status-active' : (tarjeta.estado == 'Retirado' ? 'status-inactive' : 'status-pending')}"
                  th:text="${tarjeta.estado}">Activo</span>
        </div>
        <h1 id="public-card-title"
            th:text="${tarjeta.primerNombre + ' ' + (tarjeta.segundoNombre ?: '') + ' ' + tarjeta.primerApellido + ' ' + (tarjeta.segundoApellido ?: '')}">Nombre</h1>
    </section>

    <section class="rrhh-employee-info" aria-label="Datos del empleado">
        <dl>
            <div>
                <dt>Cargo</dt><dd th:text="${tarjeta.cargo ?: '—'}">Cargo</dd>
            </div>
            <div>
                <dt>Área</dt><dd th:text="${tarjeta.area ?: '—'}">Área</dd>
            </div>
            <div>
                <dt>Sede</dt><dd th:text="${tarjeta.sede ?: '—'}">Sede</dd>
            </div>
            <div>
                <dt>RH</dt><dd th:text="${tarjeta.rh ?: '—'}">O+</dd>
            </div>
        </dl>
    </section>

    <section class="rrhh-arl-panel" aria-label="Afiliación ARL">
        <span class="rrhh-arl-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
        </span>
        <div class="rrhh-arl-copy">
            <span>Afiliación ARL</span>
            <strong th:text="${'ARL ' + tarjeta.arlNombre}">ARL Positiva</strong>
        </div>
        <a class="rrhh-arl-view" th:if="${tarjeta.arlUrl != null}" th:href="${tarjeta.arlUrl}"
           target="_blank" rel="nofollow noopener noreferrer"
           aria-label="Ver certificado ARL" title="Ver certificado ARL">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
        </a>
    </section>

    <footer><span><strong>Carnet digital</strong> - SIGO</span><span class="rrhh-footer-accent" aria-hidden="true"></span></footer>
</main>
</body>
</html>
