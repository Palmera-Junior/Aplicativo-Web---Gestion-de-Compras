<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Definir nueva contraseña</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="login-container">
    <div class="login-accent"></div>
    <div class="logo">
        <img th:src="@{/imgs/logo1.png}" alt="Palmera Junior" id="logo1">
        <p>Definir nueva contraseña</p>
    </div>
    <div th:if="${!tokenValido}" class="alert-error" role="alert">
        El enlace no es válido, ya fue usado o expiró. Solicita un enlace nuevo.
    </div>
    <div th:if="${errorRestablecimiento}" class="alert-error" role="alert" th:text="${errorRestablecimiento}"></div>
    <form th:if="${tokenValido}" th:action="@{/password/reset}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="input-group">
            <label for="nuevaContrasena">Nueva contraseña</label>
            <input type="password" id="nuevaContrasena" name="nuevaContrasena" minlength="12"
                   maxlength="72" autocomplete="new-password" required>
        </div>
        <div class="input-group">
            <label for="confirmarContrasena">Confirmar nueva contraseña</label>
            <input type="password" id="confirmarContrasena" name="confirmarContrasena" minlength="12"
                   maxlength="72" autocomplete="new-password" required>
        </div>
        <p class="password-help">Mínimo 12 caracteres.</p>
        <button type="submit" class="btn-login">Actualizar contraseña</button>
    </form>
    <a class="password-recovery-link" th:href="@{/password/forgot}">Solicitar otro enlace</a>
</main>
</body>
</html>
