<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="login-container">
    <div class="login-accent"></div>
    <div class="logo">
        <img th:src="@{/imgs/logo1.png}" alt="Palmera Junior" id="logo1">
        <p>Recuperar contraseña</p>
    </div>
    <div th:if="${solicitudEnviada}" class="alert-success" role="status">
        Si el correo está asociado a una cuenta, recibirás instrucciones para recuperar tu contraseña.
    </div>
    <form th:action="@{/password/forgot}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="input-group">
            <label for="email">Correo registrado por el administrador</label>
            <input type="email" id="email" name="email" maxlength="100" autocomplete="email"
                   placeholder="nombre@empresa.com" required>
        </div>
        <button type="submit" class="btn-login">Enviar instrucciones</button>
    </form>
    <a class="password-recovery-link" th:href="@{/login}">Volver al inicio de sesión</a>
</main>
</body>
</html>
