services:
 db:
   image: postgres:16-alpine
   restart: unless-stopped
   environment:
    POSTGRES_DB: ${DB_NAME:-palmera_junior}
    POSTGRES_USER: ${DB_USER:-postgres}
    POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"
   volumes:
     - pgdata:/var/lib/postgresql/data
   ports:
     - "5433:5432"
   networks:
     - internal
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-palmera_junior}"]
     interval: 10s
     timeout: 5s
     retries: 5

 app:
   build:
     context: .
     dockerfile: Dockerfile
   restart: unless-stopped
   depends_on:
     db:
       condition: service_healthy
   environment:
    SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/${DB_NAME:-palmera_junior}}
    SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
    SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatorio}"
    MICROSOFT_OAUTH2_ENABLED: "false"
    SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
    AWS_ACCESS_KEY_ID_SES: ${AWS_ACCESS_KEY_ID_SES:-}
    AWS_SECRET_ACCESS_KEY_SES: ${AWS_SECRET_ACCESS_KEY_SES:-}
    AWS_DEFAULT_REGION_SES: ${AWS_DEFAULT_REGION_SES:-us-east-1}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-notificaciones@palmerajunior.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Notificaciones Palmera Junior}
    JAVA_OPTS: ${JAVA_OPTS:-"-Xmx2g -Xms512m"}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
   networks:
     - internal
     - web
   expose:
     - "8081"

 nginx:
   image: nginx:1.27-alpine
   restart: unless-stopped
   depends_on:
     - app
   ports:
     - "8081:80"
   volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   networks:
     - web

networks:
 internal:
 web:

volumes:
 pgdata:
