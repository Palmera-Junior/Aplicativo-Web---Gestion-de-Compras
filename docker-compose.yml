services:
 db:
   image: postgres:16-alpine
   restart: unless-stopped
   environment:
     POSTGRES_DB: ${DB_NAME:-palmera_junior}
     POSTGRES_USER: ${DB_USER:-postgres}
     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
   volumes:
     - pgdata:/var/lib/postgresql/data
     - ./docker/init-db:/docker-entrypoint-initdb.d:ro
   networks:
     - internal
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-palmera_junior}"]
     interval: 10s
     timeout: 5s
     retries: 5

 app:
   build:
     context: .
     dockerfile: Dockerfile
   restart: unless-stopped
   depends_on:
     db:
       condition: service_healthy
   environment:
    SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/palmera_junior}
    SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
    SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    MICROSOFT_OAUTH2_ENABLED: ${MICROSOFT_OAUTH2_ENABLED:-true}
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:?MICROSOFT_CLIENT_ID es obligatorio}
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:?MICROSOFT_CLIENT_SECRET es obligatorio}
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_SCOPE: openid,profile,email
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_PROVIDER: microsoft
    SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_MICROSOFT_ISSUER_URI: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:?MICROSOFT_TENANT_ID es obligatorio}/v2.0
    AWS_ACCESS_KEY_ID_SES: ${AWS_ACCESS_KEY_ID_SES}
    AWS_SECRET_ACCESS_KEY_SES: ${AWS_SECRET_ACCESS_KEY_SES}
    AWS_DEFAULT_REGION_SES: ${AWS_DEFAULT_REGION_SES:-us-east-1}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-notificaciones@palmerajunior.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Notificaciones Palmera Junior}
    JAVA_OPTS: ${JAVA_OPTS:-"-Xmx2g -Xms512m"}
    DB_SCHEMA: ${DB_SCHEMA:-dep_compras}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
   volumes:
     - pdf_storage:/app/storage
   networks:
     - internal
     - web
   expose:
     - "8080"

 nginx:
   image: nginx:1.27-alpine
   restart: unless-stopped
   depends_on:
     - app
   ports:
     - "80:80"
   volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   networks:
     - web

networks:
 internal:
 web:

volumes:
 pgdata:
 pdf_storage:
