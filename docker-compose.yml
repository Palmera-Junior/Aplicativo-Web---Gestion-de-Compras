services:
 db:
   image: postgres:16-alpine
   restart: unless-stopped
   environment:
     POSTGRES_DB: ${DB_NAME:-palmera_junior}
     POSTGRES_USER: ${DB_USER:-postgres}
     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
   volumes:
     - pgdata:/var/lib/postgresql/data
     - ./docker/init-db:/docker-entrypoint-initdb.d:ro
   networks:
     - internal
   healthcheck:
     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-palmera_junior}"]
     interval: 10s
     timeout: 5s
     retries: 5

 app:
   build:
     context: .
     dockerfile: Dockerfile
   restart: unless-stopped
   depends_on:
     db:
       condition: service_healthy
   environment:
     SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/palmera_junior}
     SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
     SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
     GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
     GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
     JAVA_OPTS: ${JAVA_OPTS:-"-Xmx2g -Xms512m"}
     DB_SCHEMA: ${DB_SCHEMA:-dep_compras}
   volumes:
     - pdf_storage:/app/storage
   networks:
     - internal
     - web
   expose:
     - "8080"

 nginx:
   image: nginx:1.27-alpine
   restart: unless-stopped
   depends_on:
     - app
   ports:
     - "80:80"
   volumes:
     - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   networks:
     - web

networks:
 internal:
 web:

volumes:
 pgdata:
 pdf_storage:
